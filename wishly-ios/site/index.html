<!doctype html>
<!--
  Wishly's page on its Base44 address (https://wishly-61fd03a5.base44.app).
  Published with `base44 site deploy`.

  It carries Apple and Google sign-in back into the iPhone app. Base44 only
  returns a sign-in to this address, so the app opens it first:
    /?start=google&app_id=…&to=wishly://auth   remembers `to`, then starts Base44's sign-in
    /?access_token=…                            Base44's return: hands the token to the app
  It only ever hands a token to the Wishly app (wishly://) or, while testing in
  Expo Go, to a dev server on this computer or the local network (exp://).

  It is also the gift page. Every path on this address serves this file, so
    /gift/<token>                               plays the song a buyer sent, with their message
  The song comes from the getGift backend function, which returns only what
  this page shows and only for approved songs.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFF5EB">
  <!-- Safari on iPhone shows a "Wishly Songs · Get" banner, so whoever gets a
       gift can find the app. It appears once the app is on the App Store. -->
  <meta name="apple-itunes-app" content="app-id=6834450274">
  <title>Wishly</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #FFF5EB; color: #143438;
      font: 17px/1.5 Arial, "Helvetica Neue", Helvetica, sans-serif; text-align: center; padding: 0 24px; box-sizing: border-box; }
    .logo { font-weight: 700; font-size: 34px; letter-spacing: -1.5px; }
    .logo span { color: #FF6B7A; }
    p { color: #5B6466; margin: 10px 0 0; }
    a.button { display: inline-block; margin-top: 24px; padding: 14px 28px; border-radius: 999px; background: #FF6B7A; color: #143438; font-weight: 700; text-decoration: none; }
    [hidden] { display: none !important; }

    body.gift { display: block; text-align: left; padding: 0; }
    .gift main { max-width: 440px; margin: 0 auto; padding: 28px 20px 48px; }
    .gift .logo { font-size: 24px; letter-spacing: -1px; }
    /* The greeting from whoever made the song, above it. */
    .hello { margin-top: 26px; text-align: center; }
    .hello .from-us { font-size: 13px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #5B6466; }
    .hello .from-us span { color: #FF6B7A; }
    .hello h2 { margin: 6px 0 0; font: italic 400 34px/1.15 Georgia, "Times New Roman", serif; letter-spacing: -0.5px; color: #143438; }
    /* The song's own artwork: the same one it has in the app. White title on a soft fade. */
    .cover { position: relative; overflow: hidden; margin: 22px auto 0; width: 100%; max-width: 320px; aspect-ratio: 1; border-radius: 28px;
      background: #E9DFD3 center / cover no-repeat; padding: 24px; box-sizing: border-box; color: #FFFFFF;
      display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 18px 40px rgba(90, 42, 26, 0.16); }
    .cover::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,15,26,0) 55%, rgba(11,15,26,0.5) 100%); }
    .cover > * { position: relative; }
    .cover .spark { color: #FFE07A; font-size: 26px; line-height: 1; }
    .cover h1 { margin: 0; font-size: 30px; line-height: 1.12; letter-spacing: -0.5px; text-shadow: 0 1px 8px rgba(0,0,0,0.45); }
    .cover small { display: block; margin-top: 6px; font-size: 14px; opacity: 0.88; text-shadow: 0 1px 6px rgba(0,0,0,0.45); }
    .cover small span { color: #FFE07A; }
    .for { margin-top: 26px; text-align: center; font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
    .gift p.sub { text-align: center; margin-top: 4px; }
    /* The player: a bar to drag, then back 10 s, play/pause, forward 10 s. */
    .player { margin-top: 22px; }
    .seek { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 28px; margin: 0; background: transparent; cursor: pointer; touch-action: none;
      --done: 0%; }
    .seek::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, #143438 var(--done), rgba(20,52,56,0.14) var(--done)); }
    .seek::-moz-range-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, #143438 var(--done), rgba(20,52,56,0.14) var(--done)); }
    .seek::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -6px; border-radius: 50%; background: #143438; border: 3px solid #FFF5EB; box-shadow: 0 1px 4px rgba(0,0,0,0.2); }
    .seek::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #143438; border: 3px solid #FFF5EB; }
    .times { display: flex; justify-content: space-between; font-size: 13px; color: #5B6466; font-variant-numeric: tabular-nums; }
    .controls { margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 28px; }
    .play { flex: none; width: 72px; height: 72px; border: 0; border-radius: 50%; background: #FF6B7A; color: #143438; cursor: pointer;
      display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(255,107,122,0.35); }
    .skip { flex: none; width: 48px; height: 48px; border: 0; border-radius: 50%; background: transparent; color: #143438; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .skip:active, .play:active { transform: scale(0.94); }
    .card { margin-top: 22px; padding: 20px; border-radius: 22px; background: #FFFFFF; }
    .card .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #5B6466; }
    .note { margin-top: 10px; font: italic 20px/1.4 Georgia, "Times New Roman", serif; }
    .from { margin-top: 8px; font-weight: 700; font-size: 15px; }
    .lyrics h3 { margin: 16px 0 4px; font-size: 13px; color: #5B6466; text-transform: uppercase; letter-spacing: 1px; }
    .lyrics p { margin: 0; color: #143438; }
    .made { margin-top: 32px; text-align: center; font-size: 14px; }
    .made a { color: #143438; font-weight: 700; }
    .made .get-app { display: inline-block; margin-top: 14px; padding: 12px 20px; border-radius: 999px; background: #143438; color: #FFF5EB; text-decoration: none; font-size: 15px; }
  </style>
</head>
<body>
  <main id="home">
    <div class="logo">✱ wishly<span>.</span></div>
    <p id="message">Personal songs from the memories that matter.</p>
    <a id="back" class="button" hidden>Back to Wishly</a>
  </main>

  <main id="gift" hidden>
    <div class="logo">✱ wishly<span>.</span></div>
    <div class="hello" id="hello" hidden>
      <div class="from-us" id="hello-top"></div>
      <h2 id="hello-line"></h2>
    </div>
    <div class="cover" id="cover"><div class="spark">✱</div><div><h1 id="title"></h1><small id="cover-for"></small></div></div>
    <div class="for" id="for"></div>
    <p class="sub" id="sub">Press play when you have a quiet minute.</p>
    <div class="player">
      <input class="seek" id="seek" type="range" min="0" max="60" step="0.1" value="0" aria-label="Position in the song">
      <div class="times"><span id="elapsed">0:00</span><span id="left"></span></div>
      <div class="controls">
        <button class="skip" id="back10" aria-label="Back 10 seconds">
          <svg width="34" height="34" viewBox="0 0 34 34" fill="none" aria-hidden="true"><path d="M9.5 9.2A11 11 0 1 1 6 17" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M9.8 3.8v5.8H4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="17" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" font-weight="700" fill="currentColor">10</text></svg>
        </button>
        <button class="play" id="play" aria-label="Play">
          <svg id="icon-play" width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M8 4.8v16.4a1 1 0 0 0 1.5.86l13-8.2a1 1 0 0 0 0-1.72l-13-8.2A1 1 0 0 0 8 4.8z" fill="currentColor"/></svg>
          <svg id="icon-pause" width="26" height="26" viewBox="0 0 26 26" aria-hidden="true" hidden><rect x="6" y="4.5" width="5" height="17" rx="1.6" fill="currentColor"/><rect x="15" y="4.5" width="5" height="17" rx="1.6" fill="currentColor"/></svg>
        </button>
        <button class="skip" id="fwd10" aria-label="Forward 10 seconds">
          <svg width="34" height="34" viewBox="0 0 34 34" fill="none" aria-hidden="true"><path d="M24.5 9.2A11 11 0 1 0 28 17" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M24.2 3.8v5.8H30" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="17" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" font-weight="700" fill="currentColor">10</text></svg>
        </button>
      </div>
    </div>
    <audio id="audio" preload="metadata"></audio>
    <div class="card" id="note-card" hidden>
      <div class="eyebrow">A message for you</div>
      <div class="note" id="note"></div>
      <div class="from" id="from"></div>
    </div>
    <div class="card lyrics" id="lyrics" hidden><div class="eyebrow">The words</div></div>
    <!-- Opens Wishly on the App Store, so whoever gets a song can make one. -->
    <div class="made">Made with <a href="https://apps.apple.com/us/app/id6834450274">Wishly</a>, personal songs from the memories that matter.
      <a class="get-app" href="https://apps.apple.com/us/app/id6834450274">Make a song for someone you love ›</a></div>
  </main>
  <script>
    (function () {
      // The Base44 app this page belongs to (not a secret: it's in every request).
      var APP_ID = '6ae33a4fc9fab5ae61fd03a5'
      var giftToken = (location.pathname.match(/^\/gift\/([a-z0-9]+)\/?$/) || [])[1]
      if (giftToken) return showGift(giftToken)

      var query = new URLSearchParams(location.search)
      var KEY = 'wishly_return'
      var allowed = function (to) {
        return /^wishly:\/\//.test(to) ||
          /^exp:\/\/(localhost|127\.0\.0\.1|10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+)(:\d+)?\//.test(to)
      }
      var say = function (text) { document.getElementById('message').textContent = text }

      var provider = query.get('start')
      if (provider === 'google' || provider === 'apple') {
        var to = query.get('to')
        try { if (to && allowed(to)) localStorage.setItem(KEY, to); else localStorage.removeItem(KEY) } catch (e) {}
        say('Opening sign-in…')
        location.replace('/api/apps/auth' + (provider === 'apple' ? '/apple' : '') + '/login?app_id=' +
          encodeURIComponent(query.get('app_id') || '') + '&from_url=' + encodeURIComponent(location.origin + '/'))
        return
      }

      var token = query.get('access_token')
      if (token) {
        var back = 'wishly://auth'
        try {
          var saved = localStorage.getItem(KEY)
          if (saved && allowed(saved)) back = saved
          localStorage.removeItem(KEY)
        } catch (e) {}
        var link = back + (back.indexOf('?') === -1 ? '?' : '&') + 'access_token=' + encodeURIComponent(token)
        history.replaceState(null, '', '/')
        say('You’re signed in. Taking you back to Wishly…')
        var button = document.getElementById('back')
        button.href = link
        button.hidden = false
        location.replace(link)
      }

      function showGift(token) {
        document.body.className = 'gift'
        document.getElementById('home').hidden = true
        document.getElementById('gift').hidden = false
        var $ = function (id) { return document.getElementById(id) }
        fetch('/api/apps/' + APP_ID + '/functions/getGift', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: token, opened: true }),
        })
          .then(function (res) { if (!res.ok) throw new Error(); return res.json() })
          .then(function (g) {
            document.title = g.title + ' · a song for ' + g.name
            $('title').textContent = g.title
            $('cover-for').innerHTML = ''
            $('cover-for').append('for ' + g.name + ' · wishly')
            var dot = document.createElement('span'); dot.textContent = '.'; $('cover-for').appendChild(dot)
            // The same artwork the song has in the app (0–4).
            var art = (typeof g.cover === 'number' ? g.cover : 0) % 5
            $('cover').style.backgroundImage = 'url(/covers/cover' + (art + 1) + '.jpg)'
            $('for').textContent = 'A song for ' + g.name
            greet(g)
            if (g.message) {
              $('note').textContent = '“' + g.message + '”'
              $('from').textContent = g.from_name || ''
              $('note-card').hidden = false
            }
            ;(g.sections || []).forEach(function (s) {
              var h = document.createElement('h3'); h.textContent = s.label; $('lyrics').appendChild(h)
              ;(s.lines || []).forEach(function (line) { var p = document.createElement('p'); p.textContent = line; $('lyrics').appendChild(p) })
            })
            $('lyrics').hidden = !(g.sections || []).length
            player(g.audio_url)
          })
          .catch(function () {
            $('for').textContent = 'This song isn’t here'
            $('sub').textContent = 'Check the link, or ask the person who sent it.'
            $('cover').hidden = true
            document.querySelector('.player').hidden = true
          })

        // The greeting comes from the person who made the song (16 Nov 2026):
        // "Neha made you a song" over "Happy Birthday, Angela!".
        function greet(g) {
          var who = g.name
          var lines = {
            'Birthday': 'Happy Birthday, ' + who + '!',
            'Anniversary': 'Happy Anniversary, ' + who + '!',
            'Milestone': 'Here’s to you, ' + who + '!',
            'Christmas': 'Merry Christmas, ' + who + '!',
            'Wedding': 'Congratulations, ' + who + '!',
            "Valentine's Day": 'Happy Valentine’s Day, ' + who + '!',
          }
          var sender = (g.from_name || '').trim().split(/\s+/)[0]
          $('hello-top').innerHTML = '<span>✱</span> '
          $('hello-top').append(sender ? sender + ' made you a song' : 'A song made just for you')
          $('hello-line').textContent = lines[g.occasion] || 'This one’s for you, ' + who + '.'
          $('hello').hidden = false
        }

        // Play/pause, back and forward 10 seconds, and a bar to drag anywhere.
        function player(src) {
          var audio = $('audio'), seek = $('seek')
          var dragging = false
          audio.src = src
          var clock = function (t) { t = Math.max(0, Math.floor(t || 0)); return Math.floor(t / 60) + ':' + ('0' + (t % 60)).slice(-2) }
          var total = function () { return isFinite(audio.duration) ? audio.duration : 0 }
          var paint = function (at) {
            var d = total()
            seek.max = d || 60
            if (!dragging) seek.value = at
            seek.style.setProperty('--done', (d ? (seek.value / d) * 100 : 0) + '%')
            $('elapsed').textContent = clock(seek.value)
            $('left').textContent = d ? '-' + clock(d - seek.value) : ''
          }
          var jump = function (to) {
            var d = total()
            audio.currentTime = Math.max(0, d ? Math.min(d - 0.05, to) : to)
            paint(audio.currentTime)
          }
          $('play').onclick = function () { audio.paused ? audio.play() : audio.pause() }
          $('back10').onclick = function () { jump(audio.currentTime - 10) }
          $('fwd10').onclick = function () { jump(audio.currentTime + 10) }
          // The icons are SVG, which has no .hidden property: set the attribute.
          var playing = function (on) {
            $('icon-play').toggleAttribute('hidden', on)
            $('icon-pause').toggleAttribute('hidden', !on)
            $('play').setAttribute('aria-label', on ? 'Pause' : 'Play')
          }
          audio.onplay = function () { playing(true) }
          audio.onpause = function () { playing(false) }
          audio.onended = function () { audio.currentTime = 0; paint(0) }
          audio.ontimeupdate = function () { paint(audio.currentTime) }
          audio.onloadedmetadata = function () { paint(audio.currentTime) }
          // While dragging, the bar shows where they'll land; letting go jumps there.
          seek.oninput = function () { dragging = true; paint(audio.currentTime) }
          seek.onchange = function () { dragging = false; jump(Number(seek.value)) }
          paint(0)
        }
      }
    })()
  </script>
</body>
</html>
